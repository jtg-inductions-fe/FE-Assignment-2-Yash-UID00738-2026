<div class="not-found">
    <div class="not-found__content">
        <h1 class="not-found__title">404</h1>
        <h2 class="not-found__subtitle">Page Not Found</h2>
        <p class="not-found__description">
            The page you are looking for doesn't exist, has been moved, or you
            don't have permission to access it.
        </p>

        <!-- Uses Angular routerLink to redirect safely -->
        <button mat-flat-button color="primary" routerLink="/">
            Return to Dashboard
        </button>
    </div>
</div>
