<aside class="sidebar">

    <div class="sidebar__top">
        <nav class="sidebar__nav">
            <!-- We will build app-nav-item in the next step -->
            <app-nav-item *ngFor="let item of navItems" [item]="item">
            </app-nav-item>
        </nav>
    </div>

    <mat-divider></mat-divider>

        <nav class="sidebar__nav">
            <app-nav-item *ngFor="let item of commonItems" [item]="item">
            </app-nav-item>
        </nav>
    </div>
</aside>
